<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOL Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* SO! Web Kit shell (Rising Stars style) — tokens */
:root{
  --bg:#eef2f9; --panel:#f6f8fc; --card:#ffffff; --sb:#eaf0f9;
  --ink:#0f1b2d; --muted:#6b7a90; --faint:#9aa8bd; --line:#e4eaf3;
  --accent:#1e5eff; --accent-2:#1749cc; --soft:#e9f0ff; --hover:#e0e8f5;
  --good:#10b981; --warm:#ff9500; --hot:#ff4d4f;
  --font:'Anuphan', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --sb-w:252px; --r-sm:8px; --r:9px; --r-md:12px; --r-lg:16px; --pad:24px;
  --shadow-1:0 1px 3px rgba(15,27,45,.08); --shadow-2:0 10px 30px -12px rgba(15,27,45,.25);
  --shadow-hover:0 8px 18px rgba(15,27,45,.08); --line-hover:#b6c5da;
  --ease-out-quart:cubic-bezier(.25,1,.5,1); --ease-out-quint:cubic-bezier(.22,1,.36,1);
  --motion-fast:.14s; --motion-ui:.22s; --motion-enter:.32s; --t:var(--motion-fast) var(--ease-out-quart);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:var(--sb-w) 1fr;min-height:100vh}

/* sidebar */
.sidebar{background:var(--sb);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:#cfd9e8;border-radius:3px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.brand .mk{width:36px;height:36px;border-radius:var(--r);flex:0 0 auto;background:var(--accent);display:grid;place-items:center}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.2px;display:block;white-space:nowrap}
.brand small{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.navgroup{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);padding:11px 10px 5px}
.nav{display:flex;gap:9px;align-items:center;padding:7px 10px;min-height:40px;border-radius:var(--r);width:100%;text-align:left;
  transition:background var(--t),color var(--t),transform var(--t)}
.nav:hover{background:var(--hover);transform:translateX(2px)}
.nav.active,.nav.active:hover{transform:none;background:var(--accent);color:#fff}
.nav svg{width:18px;height:18px;flex:0 0 auto;stroke:#5b6b82;stroke-width:1.7;fill:none}
.nav.active svg{stroke:#fff}
.nav .tx{display:flex;flex-direction:column;line-height:1.18;min-width:0;flex:1}
.nav .th{font-size:11.5px;font-weight:700;white-space:nowrap}
.nav .en{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap}
.nav.active .en{color:#dbe6ff}
.nav .badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--hot);color:#fff}
.nav.active .badge{background:#fff;color:var(--accent)}
.planbox{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px}
.planbox small{display:block;font-size:10.5px;color:var(--muted)}
.planbox b{font-size:13px}
.prog{height:5px;background:var(--panel);border-radius:3px;overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:5px;flex:0 0 auto}
.dot.run{background:var(--accent);animation:pulse 1.2s infinite}.dot.off{background:var(--faint)}.dot.bad{background:var(--hot)}
@keyframes pulse{50%{opacity:.35}}

/* topbar */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;gap:10px;align-items:center;padding:12px var(--pad);min-height:64px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.search{flex:1 1 140px;min-width:0;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.search input{border:0;background:0;outline:0;font:inherit;flex:1;min-width:0;color:var(--ink)}
.pill{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 12px;font-size:12.5px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.pill b{color:var(--ink)}
.topbar .btn,.topbar .user{flex:0 0 auto}
.user{display:flex;gap:9px;align-items:center;margin-left:auto}
.user .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.user small{display:block;font-size:11px;color:var(--muted)}
.user a{font-size:11px;color:var(--muted);text-decoration:underline}

/* buttons */
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;background:var(--accent);color:#fff;border-radius:var(--r);
  padding:9px 15px;font-weight:700;font-size:13px;white-space:nowrap;transition:background var(--t),transform var(--t),box-shadow var(--t)}
.btn:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 6px 14px rgba(15,27,45,.1)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger{background:#fff;color:#b42318;border:1px solid #fecdca}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

/* content */
.content{padding:var(--pad) 30px 48px;width:min(100%,1500px);margin:0 auto}
@keyframes surface-enter{0%{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
.view > *{animation:surface-enter var(--motion-enter) var(--ease-out-quint) both}
.view > *:nth-child(2){animation-delay:.03s}.view > *:nth-child(3){animation-delay:.06s}.view > *:nth-child(4){animation-delay:.09s}
h2.page{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.page-sub{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:5px;margin-bottom:18px;max-width:900px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;text-align:left;display:block;width:100%;
  transition:border-color var(--motion-ui) var(--ease-out-quart),box-shadow var(--motion-ui) var(--ease-out-quart)}
.tile:hover{border-color:var(--line-hover);box-shadow:var(--shadow-hover)}
.tile .lab{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;gap:7px;align-items:center}
.tile .num{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.tile .sub{font-size:11.5px;font-weight:600;color:var(--faint);margin-top:4px}
.tile.alert{border-color:#fecdca;background:#fffbfa}.tile.alert .num{color:#d92d20}
.tile.warn .num{color:#b54708}.tile.ok .num{color:#067647}
.tile .go{font-size:11.5px;font-weight:700;color:var(--accent);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;margin-bottom:14px}
.card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card h3{font-size:15px;font-weight:700;line-height:1.25}
.card .hd small{color:var(--muted);font-size:12px;font-weight:600;display:block;margin-top:3px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*,.grid2e>*{min-width:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}

/* tables */
.tblwrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--faint);white-space:nowrap;background:var(--card);position:sticky;top:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
tbody tr{transition:background-color var(--t),box-shadow var(--t)}
tbody tr.click{cursor:pointer}
tbody tr:hover{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
tr:last-child td{border-bottom:0}
.cap{max-width:520px;color:#334155;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

/* status chips */
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st.ok{background:#e9f9f0;color:#0a7a45}.st.wait{background:#fff4e8;color:#a5590a}.st.off{background:#f0f2f6;color:#8090a5}
.st.hot{background:#fee4e2;color:#b42318}.st.info{background:var(--soft);color:var(--accent-2)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);margin:2px 3px 2px 0;white-space:nowrap}
.chip.k{background:#fff4e8;border-color:#fde3c3;color:#93460a}
.chip.b{background:#e9f9f0;border-color:#c6efd9;color:#0a6a3d}
.xb{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ink);color:#fff;margin-left:5px;vertical-align:1px}
.xb.non{background:#e6ebf2;color:#5b6b82}
.pf{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;font-weight:600}
.pf i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* filters */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-1)}
.seg button .c{font-size:11px;color:var(--faint);margin-left:4px}
.inp,select.inp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font:inherit;font-size:13px;color:var(--ink);min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12.5px;color:var(--muted)}

/* banner / status */
.banner{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px 18px;margin-bottom:14px}
.banner .big{display:flex;gap:12px;align-items:center;flex:1 1 300px}
.banner .ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e9f9f0;flex:0 0 auto}
.banner .ring.run{background:var(--soft)}.banner .ring.bad{background:#fee4e2}
.banner h4{font-size:17px;font-weight:700}
.banner .facts{display:flex;gap:22px;flex-wrap:wrap}
.banner .facts div small{display:block;font-size:11px;font-weight:700;color:var(--faint)}
.banner .facts div b{font-size:14px}
.note{border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.note.bad{background:#fef3f2;border:1px solid #fecdca;color:#912018}
.note.info{background:var(--soft);border:1px solid #d3e0ff;color:#1d3a8a}

/* to-do list */
.todo{display:flex;flex-direction:column;gap:8px}
.todo a{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);transition:border-color var(--t),background var(--t)}
.todo a:hover{border-color:var(--line-hover);background:var(--panel)}
.todo .n{font-size:18px;font-weight:700;min-width:44px;text-align:center}
.todo .t b{display:block;font-size:13px}.todo .t small{color:var(--muted);font-size:12px}
.todo .arr{margin-left:auto;color:var(--faint)}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.feed .it:last-child{border-bottom:0}
.feed .it:hover{background:var(--panel)}
.feed .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-size:13px;font-weight:700}
.feed .ico.hit{background:#fff4e8;color:#a5590a}.feed .ico.ai{background:#fee4e2;color:#b42318}
.feed .bd{min-width:0;flex:1}
.feed .bd b{font-size:13px}.feed .bd p{font-size:12.5px;color:#475467;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* charts */
.chart{width:100%;height:auto}
.chart .bar{fill:var(--accent);opacity:.85}.chart .bar:hover{opacity:1}
.chart .hit{fill:var(--warm)}
.chart text{font-family:var(--font);font-size:10px;fill:var(--faint)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:90px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.hbar .tr{height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hbar .v{text-align:right;font-weight:600}

/* channel matrix */
.mx td{vertical-align:middle}
.mx .cell{display:flex;flex-direction:column;gap:3px}
.mx .c{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.mx .c:hover{border-color:var(--accent)}
.mx .c i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.mx .c.blocked{background:#fef3f2;border-color:#fecdca}.mx .c.blocked i{background:var(--hot)}
.mx .c.ext{border-style:dashed}
.mx .c.unscanned{opacity:.55}
.mx .none{color:#d0d7e2}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--card);z-index:30;box-shadow:-20px 0 40px -20px rgba(15,27,45,.3);
  transform:translateX(100%);transition:transform var(--motion-enter) var(--ease-out-quint);display:flex;flex-direction:column}
body[data-drawer="open"] .drawer{transform:none}
.drawer .dh{display:flex;gap:12px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer .dh h3{font-size:18px;font-weight:700}
.drawer .dh small{color:var(--muted);font-size:12.5px;font-weight:600}
.drawer .dh .x{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.drawer .db{padding:18px 22px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{word-break:break-word}
.fulltext{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.6;max-height:420px;overflow:auto}
.scrim{position:fixed;inset:0;background:rgba(15,27,45,.38);z-index:19;opacity:0;visibility:hidden;transition:opacity var(--motion-ui),visibility var(--motion-ui)}
body[data-drawer="open"] .scrim,body[data-menu="open"] .scrim{opacity:1;visibility:visible}
body[data-drawer="open"] .scrim{z-index:29}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mini div{background:var(--panel);border-radius:var(--r);padding:10px 12px}
.mini small{display:block;font-size:11px;font-weight:700;color:var(--faint)}.mini b{font-size:18px}

/* forms (settings) */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.form .full{grid-column:1/-1}
.form input,.form textarea,.form select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font:inherit;font-size:13px;color:var(--ink)}
.form textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5}
.form .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;
  font-size:13px;font-weight:600;opacity:0;transition:all var(--motion-ui);z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* mobile */
.burger{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:var(--r-sm);flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:0 0 auto}
.burger i{width:16px;height:1.6px;background:var(--ink);border-radius:2px}
@media (max-width:1250px){.pill.next{display:none}}
@media (max-width:1100px){.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}.user>div{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sb-w);z-index:20;transform:translateX(-100%);transition:transform var(--motion-enter) var(--ease-out-quint);box-shadow:var(--shadow-2)}
  body[data-menu="open"] .sidebar{transform:none}
  .burger{display:flex}.topbar{padding:10px 14px;min-height:56px}.content{padding:16px 14px 40px}
  h2.page{font-size:24px}.pill{display:none}.btn .lbl{display:none}
  .form{grid-template-columns:1fr}.kv{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}.tile .num{font-size:22px}.banner .facts{gap:14px}.mini{grid-template-columns:1fr 1fr}
  .search{flex:1 1 60px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body data-menu="closed">
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mk"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div><b>KOL Watch</b><small>เฝ้าคู่แข่ง · Webull</small></div>
    </div>
    <nav id="navroot" aria-label="เมนูหลัก"></nav>
    <div class="planbox" id="planbox"><small>สถานะการตรวจ</small><b>กำลังโหลด…</b></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="sidebar"><i></i><i></i><i></i></button>
      <form class="search" id="gsearch">
        <svg width="16" height="16" fill="none" stroke="#8090a5" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="gq" placeholder="ค้นโพสต์: ชื่อ KOL, คำ, ลิงก์…" aria-label="ค้นหาโพสต์">
      </form>

const $ = s => document.querySelector(s);

function fmtTH(iso, time = true){
  if(!iso) return '—';
  if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
  const d = new Date(iso); if(isNaN(d)) return esc(iso);
  const o = {timeZone:'Asia/Bangkok', day:'numeric', month:'short'};
  if(time){ o.hour = '2-digit'; o.minute = '2-digit'; o.hour12 = false; }
  if(d.getFullYear() !== new Date().getFullYear()) o.year = '2-digit';
  return new Intl.DateTimeFormat('th-TH', o).format(d);
}
function ago(iso){
  if(!iso) return '—';
  const s = (Date.now() - new Date(iso)) / 1000;
  if(isNaN(s)) return '—';
  if(s < 0){ const m = Math.round(-s/60); return m < 60 ? `อีก ${m} นาที` : `อีก ${Math.round(m/60)} ชม.`; }
  if(s < 90) return 'เมื่อสักครู่';
  if(s < 3600) return `${Math.round(s/60)} นาทีที่แล้ว`;
  if(s < 86400) return `${Math.round(s/3600)} ชม.ที่แล้ว`;
  return `${Math.round(s/86400)} วันที่แล้ว`;
}
function dur(a, b){
  if(!a || !b) return '—';
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  return m < 60 ? `${m} นาที` : `${Math.floor(m/60)} ชม. ${m%60} นาที`;
}
const PF = {facebook:['Facebook','#1877f2'], instagram:['Instagram','#e1306c'], tiktok:['TikTok','#111111'], youtube:['YouTube','#ff0000'],

const pf = p => `<span class="pf"><i style="background:${(PF[p]||[,'#999'])[1]}"></i>${esc((PF[p]||[p])[0])}</span>`;
const xb = excl => excl ? '<span class="xb">EXCL</span>' : '<span class="xb non">NON</span>';

function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2600); }

/* ═══════════════════════════ charts ═══════════════════════════ */
function barChart(series, opt = {}){
  const W = opt.w || 1000, H = opt.h || 200, pl = 30, pb = 22, pt = 10, n = series.length;
  const max = Math.max(1, ...series.map(s => s.v));
  const bw = (W - pl) / n, nice = Math.ceil(max / 4 / (max > 50 ? 10 : 1)) * (max > 50 ? 10 : 1) * 4 || 4;
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  let g = '';
  for(let i = 0; i <= 4; i++){ const v = nice * i / 4; g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#eef2f7"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${num(v)}</text>`; }
  series.forEach((s, i) => {
    const x = pl + i * bw + bw * .18, w = bw * .64, h = Math.max(0, H - pb - y(s.v));
    g += `<rect class="bar" x="${x}" y="${H - pb - h}" width="${w}" height="${h}" rx="3"><title>${esc(s.label)}: ${num(s.v)} ${opt.unit || ''}${s.v2 != null ? ` · ${opt.unit2}: ${s.v2}` : ''}</title></rect>`;
    if(s.v2) g += `<circle class="hit" cx="${x + w/2}" cy="${H - pb - h - 7}" r="${Math.min(7, 3 + s.v2/3)}"><title>${esc(s.label)}: ${opt.unit2} ${s.v2}</title></circle>`;
    if(n <= 16 || i % Math.ceil(n/12) === 0) g += `<text x="${x + w/2}" y="${H - 6}" text-anchor="middle">${esc(s.short || '')}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title || '')}">${g}</svg>`;
}
const hbars = (obj, total) => {
  const ent = Object.entries(obj).sort((a, b) => b[1] - a[1]); const m = Math.max(1, ...ent.map(e => e[1]));
  return ent.map(([k, v]) => `<div class="hbar"><span>${pf(k)}</span><span class="tr"><i style="width:${v/m*100}%;background:${(PF[k]||[,'#1e5eff'])[1]}"></i></span><span class="v">${num(v)}</span></div>`).join('');
};

const SCOPE = {all:['ทุกช่อง','info'], exclusive:['Exclusive','wait'], resume:['ต่อรอบค้าง','off'], history:['ย้อนหลัง','off']};
const RST = {done:['เสร็จ','ok'], running:['กำลังตรวจ','info'], stopped:['หยุดกลางทาง','wait'], error:['ผิดพลาด','hot'], history:['ประมาณ','off']};
function runTable(rows){
  if(!rows.length) return '<div class="empty">ยังไม่มีรอบที่บันทึก — รอบถัดไปจะเริ่มบันทึกอัตโนมัติ</div>';
  return `<div class="tblwrap"><table><thead><tr><th>เริ่มตรวจ</th><th>ประเภท</th><th class="num">ช่องที่ตรวจ</th><th>ใช้เวลา</th>
    <th class="num">โพสต์ใหม่</th><th class="num">เจอคู่แข่ง</th><th class="num">เช็กไม่ได้</th><th>สถานะ</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr class="click" data-run="${esc(r.id)}">
      <td class="nw"><b>${fmtTH(r.started_at)}</b><div class="faint small">${ago(r.started_at)}</div></td>
      <td><span class="st ${(SCOPE[r.scope]||['',''])[1]}">${(SCOPE[r.scope]||[r.scope])[0]}</span></td>
      <td class="num">${r.total == null ? '—' : `${num(r.done)}/${num(r.total)}`}</td>
      <td class="nw">${dur(r.started_at, r.finished_at)}</td>
      <td class="num"><b>${num(r.new_posts)}</b></td>
      <td class="num">${r.hit_posts != null ? (r.hit_posts ? `<span class="st hot">${r.hit_posts} โพสต์</span>` : '0') : (r.hits ? `<span class="st hot">${r.hits}</span>` : '0')}</td>
      <td class="num">${r.blocked == null ? '—' : (r.blocked ? `<span class="st wait">${r.blocked}</span>` : '0')}</td>
      <td><span class="st ${(RST[r.status]||['','off'])[1]}">${(RST[r.status]||[r.status])[0]}</span></td>
      <td class="link nw">ดูรายละเอียด →</td></tr>`).join('')}</tbody></table></div>`;
}
function bindRuns(){ V().querySelectorAll('tr[data-run]').forEach(tr => tr.onclick = () => showRun(tr.dataset.run)); }
let LOG = {rows: [], scope: 'all', hitsOnly: false, page: 1, day: ''};
async function vLog(){
  V().innerHTML = head('ประวัติการตรวจ', 'ทุกรอบที่ระบบตรวจ: เริ่มเมื่อไร ตรวจกี่ช่อง เจอโพสต์ใหม่เท่าไร เจอคำคู่แข่งกี่โพสต์ — กดแถวเพื่อดูว่าเจออะไรบ้าง') + '<div class="empty">กำลังโหลด…</div>';
  const d = await J('/api/runs');
  LOG.rows = d.runs; LOG.meta = d; LOG.page = 1;
  drawLog();
}
function drawLog(){
  const d = LOG.meta, today = new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Bangkok'}).format(new Date());
  const thDay = iso => new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Bangkok'}).format(new Date(iso));
  const todayRows = LOG.rows.filter(r => thDay(r.started_at) === today);
  const days = [...new Set(LOG.rows.map(r => thDay(r.started_at)))];
  let rows = LOG.rows.filter(r => LOG.scope === 'all' || (LOG.scope === 'history' ? r.status === 'history' : r.status !== 'history'));
  if(LOG.hitsOnly) rows = rows.filter(r => (r.hit_posts ?? r.hits) > 0);
  if(LOG.day) rows = rows.filter(r => thDay(r.started_at) === LOG.day);
  const per = 40, pages = Math.max(1, Math.ceil(rows.length / per)); LOG.page = Math.min(LOG.page, pages);
  const recent = LOG.rows.slice(0, 48).reverse().map(r => ({label: fmtTH(r.started_at), short: fmtTH(r.started_at).split(' ').pop(), v: r.new_posts || 0, v2: r.hit_posts ?? r.hits}));
  V().innerHTML = head('ประวัติการตรวจ', 'ทุกรอบที่ระบบตรวจ: เริ่มเมื่อไร ตรวจกี่ช่อง เจอโพสต์ใหม่เท่าไร เจอคำคู่แข่งกี่โพสต์ — กดแถวเพื่อดูว่าเจออะไรบ้าง') + `
  ${d.progress.running ? `<div class="note info">กำลังตรวจรอบนี้อยู่ ${d.progress.done}/${d.progress.total} ช่อง — ${esc(d.progress.current)}</div>` : ''}
  <div class="tiles">
    <div class="tile"><div class="lab">รอบตรวจวันนี้</div><div class="num">${num(todayRows.length)}</div><div class="sub">รอบถัดไป ${d.next.at ? fmtTH(d.next.at) : '—'}</div></div>
    <div class="tile"><div class="lab">โพสต์ใหม่วันนี้</div><div class="num">${num(todayRows.reduce((a, r) => a + (r.new_posts || 0), 0))}</div><div class="sub">รวมทุกรอบ</div></div>
    <div class="tile ${todayRows.some(r => (r.hit_posts ?? r.hits) > 0) ? 'alert' : ''}"><div class="lab">เจอคู่แข่งวันนี้</div><div class="num">${num(todayRows.reduce((a, r) => a + ((r.hit_posts ?? r.hits) || 0), 0))}</div><div class="sub">โพสต์</div></div>
    <div class="tile"><div class="lab">รอบทั้งหมดในบันทึก</div><div class="num">${num(LOG.rows.length)}</div><div class="sub">บันทึกจริง ${num(d.real)} · ย้อนหลัง ${num(d.history)}</div></div>
  </div>
  <div class="card"><div class="hd"><div><h3>โพสต์ใหม่ต่อรอบ (48 รอบล่าสุด)</h3><small>แท่ง = โพสต์ใหม่ที่เจอในรอบนั้น · จุดส้ม = เจอคำคู่แข่ง</small></div></div>${barChart(recent, {unit:'โพสต์', unit2:'เจอคู่แข่ง', h:180})}</div>
  <div class="card">
    <div class="bar">
      <div class="seg" id="logScope">${[['all','ทั้งหมด'],['real','บันทึกจริง'],['history','ย้อนหลัง']].map(([k, l]) => `<button data-k="${k}" class="${LOG.scope === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <select class="inp" id="logDay"><option value="">ทุกวัน</option>${days.map(x => `<option ${LOG.day === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="logHits" ${LOG.hitsOnly ? 'checked' : ''}> เฉพาะรอบที่เจอคู่แข่ง</label>
      <span class="muted small" style="margin-left:auto">${num(rows.length)} รอบ</span>
    </div>
    ${runTable(rows.slice((LOG.page - 1) * per, LOG.page * per))}
    <div class="pager"><button class="btn ghost sm" id="lp" ${LOG.page <= 1 ? 'disabled' : ''}>← ก่อนหน้า</button>หน้า ${LOG.page}/${pages}<button class="btn ghost sm" id="ln" ${LOG.page >= pages ? 'disabled' : ''}>ถัดไป →</button></div>
    <p class="faint small" style="margin-top:10px">“ย้อนหลัง” = รอบก่อนเริ่มมีบันทึก ประมาณจากเวลาที่ระบบบันทึกโพสต์ (โชว์เฉพาะรอบที่เจอโพสต์ใหม่ ไม่รู้จำนวนช่องที่ตรวจ)</p>
  </div>`;
  V().querySelectorAll('#logScope button').forEach(b => b.onclick = () => { LOG.scope = b.dataset.k; LOG.page = 1; drawLog(); });
  $('#logDay').onchange = e => { LOG.day = e.target.value; LOG.page = 1; drawLog(); };
  $('#logHits').onchange = e => { LOG.hitsOnly = e.target.checked; LOG.page = 1; drawLog(); };
  $('#lp').onclick = () => { LOG.page--; drawLog(); }; $('#ln').onclick = () => { LOG.page++; drawLog(); };
  bindRuns();
}

function showChannel(id){
  let k, c; for(const kk of CH.data.kols){ const f = kk.channels.find(x => x.id === id); if(f){ k = kk; c = f; break; } }
  if(!c) return;
  const [cat, label, fix] = c.status === 'blocked' ? classify(c.error) : [];
  openDrawer(`${esc(k.name)} ${xb(k.excl)}`, `${pf(c.platform)} · ${c.status === 'blocked' ? '<span class="st hot">เช็กไม่ได้</span>' : '<span class="st ok">ตรวจได้</span>'}`, `
    <div class="bar"><a class="btn sm" href="${esc(c.url)}" target="_blank" rel="noopener">เปิดหน้าช่อง ↗</a>
      <a class="btn ghost sm" href="#db" id="chPosts">ดูโพสต์ของ KOL นี้ในฐานข้อมูล</a></div>
    ${c.status === 'blocked' ? `<div class="note bad"><div><b>${esc(label)}</b><br>${esc(fix)}<div class="small" style="margin-top:6px;opacity:.8">${esc(c.error)}</div></div></div>` : ''}
    <div class="mini"><div><small>โพสต์ปี 2026</small><b>${num(c.posts_year)}</b></div><div><small>โพสต์ทั้งหมดในระบบ</small><b>${num(c.posts)}</b></div>
      <div><small>เจอคำคู่แข่ง</small><b>${num(c.hits)}</b></div></div>
    <dl class="kv"><dt>ลิงก์</dt><dd><a class="link" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></dd>
      <dt>ที่มาของลิงก์</dt><dd>${c.source === 'นอกชีต' ? 'เพิ่มเองนอกชีตทีม (extra_channels)' : 'Google Sheet ของทีม'}</dd>
      <dt>โพสต์ล่าสุดที่เก็บ</dt><dd>${fmtTH(c.last_post)}</dd>
      <dt>ตรวจล่าสุด</dt><dd>${fmtTH(c.last_checked)} (${ago(c.last_checked)})</dd>
      <dt>ตรวจได้ล่าสุด</dt><dd>${fmtTH(c.last_ok)}</dd>
      <dt>แพลตฟอร์มนี้</dt><dd>${c.scanned ? 'เปิดตรวจอยู่' : 'ปิดตรวจในตั้งค่า (scan_platforms)'}</dd>
      <dt>Tier</dt><dd>${esc(k.tier || '—')}</dd></dl>`);
  $('#chPosts').onclick = () => { DBQ = {...DBQ0, kol: k.name, platform: c.platform}; closeDrawer(); };
}
function classify(e){
  e = (e || '').toLowerCase();
  if(/not_available|only shared it with|login/.test(e)) return ['private', 'ต้องล็อกอินถึงจะเห็น', 'เป็นโปรไฟล์ส่วนตัวหรือจำกัดผู้ชม ระบบดึงแบบไม่ล็อกอินเลยไม่เห็นโพสต์'];
  if(/not_found|ไม่พบบัญชี/.test(e)) return ['notfound', 'ไม่พบบัญชี', 'ลิงก์ในชีตอาจผิด บัญชีถูกปิด หรือเปลี่ยนชื่อ'];
  if(/0 โพสต์|no_items|noresults/.test(e)) return ['empty', 'ดึงได้ 0 โพสต์', 'บัญชีอาจเปลี่ยนชื่อ เป็นส่วนตัว หรือยังไม่เคยโพสต์'];
  return ['other', 'ข้อผิดพลาดอื่น', ''];
}

  <div class="card"><div class="hd"><div><h3>คำที่เฝ้าระวัง</h3><small>รูปแบบ JSON: {"ชื่อแบรนด์": ["ตัวสะกด1", "ตัวสะกด2"]}</small></div></div><div class="form">
    ${F('watchlist', 'คำคู่แข่ง', '', true, 8)}
    ${F('watchlist_unbranded', 'คำกว้าง (นับเฉพาะโพสต์ที่ไม่พูดถึง Webull)', 'เว้น {} = ปิด', false, 3)}
    ${F('client_brands', 'แบรนด์ลูกค้าที่จะทำรายงาน', '', false, 3)}
  </div></div>
  <div class="card"><div class="hd"><div><h3>LINE</h3></div></div><div class="form">
    <div><label for="line_mode">โหมดส่ง</label><select id="line_mode"><option value="broadcast">Broadcast — ทุกคนที่ add bot</option><option value="push">Push — เฉพาะปลายทางด้านล่าง</option></select></div>
    ${F('line_to', 'ปลายทาง (เฉพาะโหมด Push: userId/groupId)')}
    ${F('line_token', 'Channel access token (เว้นว่าง = ไม่เปลี่ยน)')}
    ${F('brand_kols_per_bubble', 'จำนวน KOL ต่อบับเบิล (รายงาน Webull)')}
    <div class="full small muted" id="lineSources"></div>
  </div></div>
  <div class="card"><div class="hd"><div><h3>AI อ่านโพสต์</h3></div></div><div class="form">
    ${F('ai_review_enabled', 'เปิด AI อ่านโพสต์ (1/0)')}
    ${F('ai_alerts_enabled', 'เด้ง LINE ป้ายแดงเมื่อ AI ว่าด่วน (1/0)')}
    ${F('ai_alert_max_age_days', 'เด้งเฉพาะโพสต์ที่ลงภายใน (วัน)')}
    ${F('ai_review_policy', 'กติกาให้ AI (เขียนภาษาคนได้ · เว้นว่าง = กติกามาตรฐาน)', '', true, 5)}
  </div></div>
  <div class="card"><div class="hd"><div><h3>คนที่เข้าใช้ได้ (ล็อกอินด้วย SO! HR)</h3><small>ใส่ชื่อผู้ใช้ SO! HR คั่นด้วย , — ลบชื่อออก = เข้าไม่ได้ทันที</small></div></div>
    <div class="form"><div class="full"><label for="hr_users">ชื่อผู้ใช้ SO! HR ที่อนุญาต</label><input id="hr_users"></div></div>
    <div class="tblwrap" style="margin-top:12px" id="userTbl"><div class="empty">กำลังโหลด…</div></div></div>
  <div class="bar"><button class="btn" id="saveBtn">บันทึกการตั้งค่า</button></div>`;
  J('/api/users').then(u => {
    $('#hr_users').value = u.allowed.join(', ');
    $('#userTbl').innerHTML = `<table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>ตำแหน่ง</th><th>สิทธิ์</th><th>เข้าล่าสุด</th><th class="num">เข้าแล้ว</th></tr></thead><tbody>
      ${u.users.map(x => `<tr><td><b>${esc(x.username)}</b></td><td>${esc(x.name_en || '')} <span class="faint small">${esc(x.name_th || '')}</span></td><td class="small muted">${esc(x.position || '')}</td>
        <td>${x.allowed ? '<span class="st ok">เข้าได้</span>' : '<span class="st off">ไม่มีสิทธิ์</span>'}</td>
        <td class="small nw">${x.last_login ? fmtTH(x.last_login) + ' · ' + (x.via === 'line' ? 'LINE' : 'รหัส') : '<span class="faint">ยังไม่เคยเข้า</span>'}</td><td class="num">${x.logins || 0}</td></tr>`).join('')}</tbody></table>`;
  });
  ['run_times', 'auto_enabled', 'posts_per_check', 'scan_platforms', 'sheet_id', 'enable_bd_fallback', 'line_to', 'brand_kols_per_bubble', 'ai_review_enabled', 'ai_alerts_enabled', 'ai_alert_max_age_days', 'ai_review_policy']
    .forEach(k => $('#' + k).value = s[k] ?? '');
  $('#line_mode').value = s.line_mode || 'broadcast';
  $('#watchlist').value = pj(s.watchlist); $('#watchlist_unbranded').value = pj(s.watchlist_unbranded); $('#client_brands').value = pj(s.client_brands);
  $('#line_token').placeholder = s.line_token_set ? '•••• (ตั้งไว้แล้ว)' : 'ยังไม่ตั้ง';
  const ls = STATE.line_sources || [];
  $('#lineSources').innerHTML = ls.length ? 'id ที่จับได้จาก webhook (กดเพื่อใส่ในช่องปลายทาง): ' + ls.map(x => `<a href="#" class="link lsrc" data-id="${esc(x.source_id)}">[${esc(x.source_type)}] ${esc(x.source_id).slice(0, 14)}…</a>`).join(' · ') : '';
  V().querySelectorAll('.lsrc').forEach(a => a.onclick = e => { e.preventDefault(); $('#line_to').value = a.dataset.id; });
  $('#saveBtn').onclick = async () => {
    for(const k of ['watchlist', 'watchlist_unbranded', 'client_brands']){ try { JSON.parse($('#' + k).value || '{}'); } catch(e){ toast('JSON ผิดรูปแบบในช่อง ' + k); return; } }
    const b = {hr_users: $('#hr_users').value}; ['run_times', 'auto_enabled', 'posts_per_check', 'scan_platforms', 'sheet_id', 'enable_bd_fallback', 'line_to', 'line_mode', 'brand_kols_per_bubble', 'ai_review_enabled', 'ai_alerts_enabled', 'ai_alert_max_age_days', 'ai_review_policy', 'watchlist', 'watchlist_unbranded', 'client_brands'].forEach(k => b[k] = $('#' + k).value);
    if($('#line_token').value.trim()) b.line_token = $('#line_token').value.trim();
    const r = await P('/api/settings', b); toast(r.error || 'บันทึกแล้ว'); $('#line_token').value = '';
  };
}

/* ═══════════════════════════ router + status ═══════════════════════════ */
const VIEWS = {home:vHome, hits:vHits, ai:vAi, brand:vBrand, takedown:vTakedown, log:vLog, keywords:vKeywords, channels:vChannels, blocked:vBlocked, db:vDb, settings:vSettings};
async function route(){
  const id = (location.hash.slice(1) || 'home').split('/')[0];
  VIEW = VIEWS[id] ? id : 'home'; renderNav(); setMenu(false); closeDrawer();
  window.scrollTo(0, 0);
  try { await VIEWS[VIEW](); } catch(e){ console.error(e); V().innerHTML = head('โหลดไม่สำเร็จ', esc(e.message)); }
}
addEventListener('hashchange', route);
async function pollStatus(){
  try {
    const d = await J('/api/progress'); const pr = d.progress, last = d.last;
    const wasRunning = PROG && PROG.running; PROG = pr;
    $('#planbox').innerHTML = pr.running
      ? `<small>กำลังตรวจ</small><b><span class="dot run"></span>${pr.done}/${pr.total} ช่อง</b><div class="prog"><i style="width:${pr.total ? pr.done / pr.total * 100 : 0}%"></i></div><small style="margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pr.current)}</small>`
      : `<small>ตรวจล่าสุด</small><b><span class="dot"></span>${ago((last && (last.finished_at || last.started_at)) || pr.last_run || d.last_check)}</b><small style="margin-top:3px">ถัดไป ${d.next.at ? fmtTH(d.next.at) : esc(d.next.label || '—')}</small>`;
    $('#nextPill').innerHTML = pr.running ? `กำลังตรวจ <b>${pr.done}/${pr.total}</b>` : `รอบถัดไป <b>${d.next.at ? fmtTH(d.next.at) : '—'}</b>`;
    $('#runBtn').style.display = pr.running ? 'none' : ''; $('#stopBtn').style.display = pr.running ? '' : 'none';
    if(wasRunning && !pr.running && (VIEW === 'home' || VIEW === 'log')) route();
  } catch(e){}
}
$('#runBtn').onclick = async () => {
  if(!confirm('เริ่มตรวจทุกช่องตอนนี้เลยไหม? (ใช้เครดิต Apify เท่ากับ 1 รอบ)')) return;
  const r = await P('/api/run'); toast(r.error ? 'มีรอบกำลังตรวจอยู่แล้ว' : 'เริ่มตรวจแล้ว'); pollStatus();
};
$('#stopBtn').onclick = async () => { await P('/api/stop'); toast('สั่งหยุดแล้ว — จะหยุดหลังช่องที่กำลังตรวจ'); pollStatus(); };
$('#syncBtn').onclick = async () => {
  $('#syncBtn').disabled = true; toast('กำลังซิงก์จากชีต…');
  const r = await P('/api/sync', {}); $('#syncBtn').disabled = false;
  toast(r.error ? 'ซิงก์ไม่สำเร็จ: ' + r.error : `ซิงก์แล้ว: ${r.kols} KOL · ${r.channels} ช่อง (ใหม่ ${r.new_channels})`);
  CH.data = null; DBMETA = null; if(['channels', 'blocked', 'home'].includes(VIEW)) route();
};
$('#gsearch').onsubmit = e => { e.preventDefault(); DBQ = {...DBQ0, q: $('#gq').value.trim()}; if(VIEW === 'db') vDb(); else location.hash = 'db'; };
const setMenu = open => { document.body.dataset.menu = open ? 'open' : 'closed'; $('#burger').setAttribute('aria-expanded', String(open)); };
$('#burger').onclick = () => setMenu(document.body.dataset.menu !== 'open');

route(); pollStatus(); setInterval(pollStatus, 5000);
J('/api/me').then(m => { const n = (m.user && m.user.name) || m.api_key || '—'; $('#uname').textContent = n; $('#uav').textContent = n.slice(0, 2).toUpperCase(); });
setInterval(() => { if(VIEW === 'home' && document.body.dataset.drawer !== 'open') vHome(); }, 60000);
</script>
</body>
</html>
